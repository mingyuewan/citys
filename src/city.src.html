<title>深圳湾空中城市</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed WebGL scene; title plate top-left, control rail bottom-left, info card top-right.
   The UI follows the scene's own clock (day / dusk / night) rather than the OS theme. */
:root {
  --ink: #e9ecf2;
  --ink-dim: #9aa5b8;
  --panel: rgba(12, 17, 28, 0.70);
  --panel-line: rgba(160, 180, 210, 0.18);
  --accent: #f2a541;      /* sodium streetlight amber */
  --accent-ink: #1b1305;
  --bg: #070a12;
  --danger: #ff7a6b;
  --f-display: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html[data-mode="day"] {
  --ink: #17202c;
  --ink-dim: #566173;
  --panel: rgba(250, 248, 243, 0.76);
  --panel-line: rgba(40, 60, 80, 0.16);
  --accent: #c8691a;
  --accent-ink: #fff8ef;
  --bg: #d9dfe4;
  --danger: #b4321f;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 14px;
  -webkit-font-smoothing: antialiased;
}
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#gl.dragging { cursor: grabbing; }

.panel {
  background: var(--panel);
  border: 1px solid var(--panel-line);
  border-radius: 10px;
  backdrop-filter: blur(14px) saturate(1.2);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
  transition: background .6s, color .6s, border-color .6s;
}

#plate {
  position: fixed;
  top: calc(16px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  padding: 14px 18px 12px;
  max-width: min(370px, calc(100vw - 32px));
  pointer-events: none;
}
#plate .eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; color: var(--ink-dim); text-transform: uppercase; margin-right: 58px; }
#plate .plate-x { position: absolute; top: 8px; right: 8px; pointer-events: auto; padding: 7px 10px; font-size: 12px; border: 1px solid var(--panel-line); }
#plate.collapsed { padding: 8px 12px 8px 14px; }
#plate.collapsed .eyebrow, #plate.collapsed .coords, #plate.collapsed #stats, #plate.collapsed #sky, #plate.collapsed #hint { display: none; }
#plate.collapsed h1 { font-size: 18px; margin: 2px 64px 2px 0; }
#plate.collapsed #credit { font-size: 10.5px; margin-top: 2px; }
#plate h1 {
  margin: 4px 0 2px; font-family: var(--f-display); font-weight: 900;
  font-size: clamp(26px, 4.2vw, 38px); line-height: 1.1; letter-spacing: .04em; text-wrap: balance;
}
#plate h1 span { color: var(--accent); }
#plate .coords { font-family: var(--f-mono); font-size: 12px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
#stats { margin-top: 8px; font-size: 12px; color: var(--ink-dim); font-variant-numeric: tabular-nums; line-height: 1.55; }
#stats b { color: var(--ink); font-weight: 500; font-family: var(--f-mono); }
#credit { font-size: 11px; color: var(--ink-dim); margin-top: 4px; line-height: 1.5; }
#credit a { color: inherit; pointer-events: auto; }
#sky { margin-top: 6px; font-size: 12px; color: var(--ink-dim); line-height: 1.5; }
#sky b { color: var(--ink); font-weight: 500; }

#rail {
  position: fixed;
  left: max(16px, env(safe-area-inset-left, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  padding: 6px;
  max-width: calc(100vw - 32px);
}
.btn {
  appearance: none; border: 1px solid transparent; background: transparent; color: var(--ink);
  font: 500 13px/1 var(--f-body); padding: 9px 12px; border-radius: 7px; cursor: pointer;
  display: inline-flex; gap: 6px; align-items: center; white-space: nowrap;
}
.btn:hover { background: color-mix(in srgb, var(--ink) 9%, transparent); }
.btn:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.btn .k { font-family: var(--f-mono); font-size: 11px; opacity: .6; }
.sep { width: 1px; height: 22px; background: var(--panel-line); margin: 0 2px; }
select {
  appearance: none; background: transparent; color: var(--ink); border: 1px solid var(--panel-line);
  font: 500 13px/1 var(--f-body); padding: 8px 26px 8px 10px; border-radius: 7px; cursor: pointer; max-width: 210px;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 13px) 52%, calc(100% - 8px) 52%; background-size: 5px 5px; background-repeat: no-repeat;
}
select option { color: #111; }
.clock { display: inline-flex; align-items: center; gap: 8px; padding: 0 6px 0 8px; }
.clock output { font: 500 13px/1 var(--f-mono); min-width: 3.2em; font-variant-numeric: tabular-nums; }
.clock input[type="range"] { width: 140px; accent-color: var(--accent); }

#card {
  position: fixed;
  top: calc(16px + env(safe-area-inset-top, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  width: min(300px, calc(100vw - 32px));
  padding: 14px 16px;
}
#card h2 { margin: 0 28px 6px 0; font: 600 18px/1.3 var(--f-display); text-wrap: balance; }
#card dl { margin: 8px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; font-size: 13px; }
#card dt { color: var(--ink-dim); }
#card dd { margin: 0; font-family: var(--f-mono); font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
#card .est { color: var(--ink-dim); font-family: var(--f-body); font-size: 12px; }
#card .x { position: absolute; top: 8px; right: 8px; padding: 6px 8px; }

#loader {
  position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#loader .box { pointer-events: auto; padding: 22px 24px; width: min(440px, 100%); }
#loader h3 { margin: 0 0 6px; font: 600 17px/1.35 var(--f-display); }
#loader p { margin: 6px 0; color: var(--ink-dim); line-height: 1.6; max-width: 62ch; }
#loader .bar { height: 3px; background: var(--panel-line); border-radius: 2px; overflow: hidden; margin-top: 14px; }
#loader .bar i { display: block; height: 100%; width: 30%; background: var(--accent); border-radius: 2px; animation: slide 1.4s ease-in-out infinite; }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
#loader .err { color: var(--danger); font-family: var(--f-mono); font-size: 12px; white-space: pre-wrap; }

#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.lbl {
  position: absolute; left: 0; top: 0; transform: translate(-50%, -100%);
  white-space: nowrap; text-align: center; will-change: transform;
  text-shadow: 0 1px 2px rgba(0,0,0,.65), 0 0 8px rgba(0,0,0,.45);
  color: #f5f2ea; transition: opacity .3s;
}
html[data-mode="day"] .lbl { color: #1a2230; text-shadow: 0 0 3px rgba(255,255,255,.95), 0 0 9px rgba(255,255,255,.8); }
.lbl.bld { font: 500 12px/1.25 var(--f-body); }
.lbl.bld::after { content: ""; display: block; width: 1px; height: 14px; margin: 3px auto 0; background: currentColor; opacity: .55; }
.lbl.bld small { display: block; font: 400 10.5px/1.2 var(--f-mono); opacity: .75; }
.lbl.area { font: 600 15px/1 var(--f-display); letter-spacing: .5em; transform: translate(-50%, -50%); opacity: .85; }
.lbl.sea { font: 600 20px/1 var(--f-display); letter-spacing: .9em; color: #bfe6e4; transform: translate(-50%, -50%); }
html[data-mode="day"] .lbl.sea { color: #0f5b61; }
.lbl.air { font: 500 11px/1.2 var(--f-mono); opacity: .8; transform: translate(-50%, -150%); }
body.touring .lbl.bld, body.touring .lbl.air { opacity: 0 !important; }

#hint { font-size: 11.5px; color: var(--ink-dim); margin-top: 4px; line-height: 1.5; }
#hint b { color: var(--ink); font-weight: 500; }

@media (max-width: 760px) {
  #hint { display: none; }
  #card { top: auto; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
  .btn .k { display: none; }
  #plate { padding: 10px 14px; }
  #stats, #credit { font-size: 11px; }
  #sky { display: none; }
  .clock input[type="range"] { width: 110px; }
}
@media (prefers-reduced-motion: reduce) { #loader .bar i { animation: none; width: 100%; opacity: .5; } }
</style>

<canvas id="gl" aria-label="深圳湾 3D 城市场景"></canvas>
<div id="labels" aria-hidden="true"></div>

<header id="plate" class="panel">
  <button class="btn plate-x" id="bPlate" type="button" aria-expanded="true" aria-controls="plate">收起</button>
  <div class="eyebrow">Floating Island · 南山后海 · Aerial 3D</div>
  <h1>深圳湾<span>·</span>空中之岛</h1>
  <div class="coords" id="coords">22.5150°N 113.9420°E</div>
  <div id="stats">正在准备…</div>
  <div id="sky"></div>
  <div id="hint"><b>拖动</b> 平移 · <b>右键/Shift 拖动</b> 旋转 · <b>滚轮</b> 缩放 · <b>点击</b> 楼体查看</div>
  <div id="credit">道路 © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap 贡献者</a> · 地标坐标与高度：维基百科 · 其余楼体按真实街区生成</div>
</header>

<nav id="rail" class="panel" aria-label="视图控制">
  <span class="clock"><label for="tod" class="sr">时间</label><input id="tod" type="range" min="5" max="28.9" step="0.05" value="15.5" aria-label="一天中的时间"><output id="todOut" for="tod">15:30</output></span>
  <button class="btn" id="bMode" type="button" aria-pressed="false" title="白天 / 夜晚 (N)">夜景 <span class="k">N</span></button>
  <span class="sep" aria-hidden="true"></span>
  <button class="btn" id="bTour" type="button" aria-pressed="false" title="空中漫游 (F)">空中漫游 <span class="k">F</span></button>
  <button class="btn" id="bOrbit" type="button" aria-pressed="false" title="自动环绕 (R)">环绕 <span class="k">R</span></button>
  <button class="btn" id="bHome" type="button" title="回到总览 (H)">总览 <span class="k">H</span></button>
  <select id="selLm" aria-label="飞往">
    <option value="">飞往…</option>
  </select>
  <span class="sep" aria-hidden="true"></span>
  <button class="btn" id="bCloud" type="button" aria-pressed="true" title="云层 (C)">云层 <span class="k">C</span></button>
  <button class="btn" id="bGen" type="button" aria-pressed="true" title="显示/隐藏生成的楼体 (G)">生成楼体 <span class="k">G</span></button>
</nav>

<aside id="card" class="panel" hidden aria-live="polite">
  <button class="btn x" id="bClose" type="button" aria-label="关闭">✕</button>
  <h2 id="cName">—</h2>
  <dl id="cList"></dl>
</aside>


<div id="loader">
  <div class="box panel" role="status">
    <h3 id="lTitle">正在搭建深圳湾</h3>
    <p id="lText">读取内置的道路、海岸与楼体数据</p>
    <div class="err" id="lErr" hidden></div>
    <div class="bar" id="lBar"><i></i></div>
  </div>
</div>

<script type="application/json" id="szdata">/*__SZDATA__*/</script>
<script type="application/json" id="sztex">/*__SZTEX__*/</script>
<script>
"use strict";
/* =========================================================================
   深圳湾空中城市 — dependency-free WebGL2 renderer.
   Roads: OpenStreetMap. Landmarks: Wikipedia coordinates / heights.
   Other buildings: generated inside the real street blocks.
   ========================================================================= */
const D = JSON.parse(document.getElementById("szdata").textContent);
const CENTER = { lat: D.center[0], lon: D.center[1] };
const $ = s => document.querySelector(s);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const fmt = n => n.toLocaleString("zh-CN");
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function hash1(n) { n = Math.sin(n * 12.9898 + 4.1414) * 43758.5453; return n - Math.floor(n); }
function rng(seed) { let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
const loader = {
  show(title, text, opts = {}) {
    $("#loader").hidden = false; $("#lTitle").textContent = title; $("#lText").textContent = text || "";
    $("#lErr").hidden = !opts.err; $("#lErr").textContent = opts.err || ""; $("#lBar").hidden = !!opts.err;
  },
  hide() { $("#loader").hidden = true; }
};
function ringArea(r) { let a = 0; for (let i = 0, n = r.length; i < n; i++) { const p = r[i], q = r[(i + 1) % n]; a += p[0] * q[1] - q[0] * p[1]; } return a / 2; }
function centroid(r) { let x = 0, z = 0; for (const p of r) { x += p[0]; z += p[1]; } return [x / r.length, z / r.length]; }
const ZONE_ZH = { cbd: "后海商务区", tech: "科技园", shekou: "蛇口片区", res: "住宅片区", village: "城中村" };

/* ---------------- math ---------------- */
const M = {
  persp(fovy, asp, n, f) { const t = 1 / Math.tan(fovy / 2), nf = 1 / (n - f); return new Float32Array([t / asp, 0, 0, 0, 0, t, 0, 0, 0, 0, (f + n) * nf, -1, 0, 0, 2 * f * n * nf, 0]); },
  ortho(l, r, b, t, n, f) { return new Float32Array([2 / (r - l), 0, 0, 0, 0, 2 / (t - b), 0, 0, 0, 0, -2 / (f - n), 0, -(r + l) / (r - l), -(t + b) / (t - b), -(f + n) / (f - n), 1]); },
  lookAt(e, c, u) {
    let zx = e[0] - c[0], zy = e[1] - c[1], zz = e[2] - c[2], l = Math.hypot(zx, zy, zz); zx /= l; zy /= l; zz /= l;
    let xx = u[1] * zz - u[2] * zy, xy = u[2] * zx - u[0] * zz, xz = u[0] * zy - u[1] * zx; l = Math.hypot(xx, xy, xz); xx /= l; xy /= l; xz /= l;
    const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
    return new Float32Array([xx, yx, zx, 0, xy, yy, zy, 0, xz, yz, zz, 0, -(xx * e[0] + xy * e[1] + xz * e[2]), -(yx * e[0] + yy * e[1] + yz * e[2]), -(zx * e[0] + zy * e[1] + zz * e[2]), 1]);
  },
  mul(a, b) { const o = new Float32Array(16); for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + j] * b[i * 4 + k]; o[i * 4 + j] = s; } return o; },
  inv(m) {
    const a = m, o = new Float32Array(16);
    const b00 = a[0] * a[5] - a[1] * a[4], b01 = a[0] * a[6] - a[2] * a[4], b02 = a[0] * a[7] - a[3] * a[4], b03 = a[1] * a[6] - a[2] * a[5],
      b04 = a[1] * a[7] - a[3] * a[5], b05 = a[2] * a[7] - a[3] * a[6], b06 = a[8] * a[13] - a[9] * a[12], b07 = a[8] * a[14] - a[10] * a[12],
      b08 = a[8] * a[15] - a[11] * a[12], b09 = a[9] * a[14] - a[10] * a[13], b10 = a[9] * a[15] - a[11] * a[13], b11 = a[10] * a[15] - a[11] * a[14];
    let det = b00 * b11 - b01 * b10 + b02 * b09 + b03 * b08 - b04 * b07 + b05 * b06; det = 1 / det;
    o[0] = (a[5] * b11 - a[6] * b10 + a[7] * b09) * det; o[1] = (a[2] * b10 - a[1] * b11 - a[3] * b09) * det;
    o[2] = (a[13] * b05 - a[14] * b04 + a[15] * b03) * det; o[3] = (a[10] * b04 - a[9] * b05 - a[11] * b03) * det;
    o[4] = (a[6] * b08 - a[4] * b11 - a[7] * b07) * det; o[5] = (a[0] * b11 - a[2] * b08 + a[3] * b07) * det;
    o[6] = (a[14] * b02 - a[12] * b05 - a[15] * b01) * det; o[7] = (a[8] * b05 - a[10] * b02 + a[11] * b01) * det;
    o[8] = (a[4] * b10 - a[5] * b08 + a[7] * b06) * det; o[9] = (a[1] * b08 - a[0] * b10 - a[3] * b06) * det;
    o[10] = (a[12] * b04 - a[13] * b02 + a[15] * b00) * det; o[11] = (a[9] * b02 - a[8] * b04 - a[11] * b00) * det;
    o[12] = (a[5] * b07 - a[4] * b09 - a[6] * b06) * det; o[13] = (a[0] * b09 - a[1] * b07 + a[2] * b06) * det;
    o[14] = (a[13] * b01 - a[12] * b03 - a[14] * b00) * det; o[15] = (a[8] * b03 - a[9] * b01 + a[10] * b00) * det;
    return o;
  },
  xf(m, x, y, z) { const w = m[3] * x + m[7] * y + m[11] * z + m[15]; return [(m[0] * x + m[4] * y + m[8] * z + m[12]) / w, (m[1] * x + m[5] * y + m[9] * z + m[13]) / w, (m[2] * x + m[6] * y + m[10] * z + m[14]) / w, w]; }
};
const norm3 = v => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; };

/* ---------------- floating island outline ---------------- */
const ISLE = { R0: 2850, thH: 0, lobe: 3390 };
(() => { const hk = D.landmarks.find(l => l.k === "hanking"); if (hk) { ISLE.thH = Math.atan2(hk.c[1], hk.c[0]); ISLE.lobe = Math.hypot(hk.c[0], hk.c[1]) + 75; } })();
function wrapA(a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; }
function isleR(th) {
  const b = ISLE.R0 * (1 + 0.05 * Math.sin(3 * th + 1) + 0.035 * Math.sin(5 * th + 2) + 0.02 * Math.sin(9 * th + 0.5) + 0.012 * Math.sin(17 * th + 3.1));
  const d = wrapA(th - ISLE.thH), l = ISLE.lobe * Math.exp(-((d / 0.16) ** 2));
  const m = Math.max(b, l); return m + 60 * Math.log(Math.exp((b - m) / 60) + Math.exp((l - m) / 60));
}
function inIsle(x, z, margin = 0) { return Math.hypot(x, z) < isleR(Math.atan2(z, x)) - margin; }
function vn1(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash1(i), hash1(i + 1), u); }
function vn2(x, y) { const i = Math.floor(x), j = Math.floor(y), f = x - i, g = y - j, u = f * f * (3 - 2 * f), v = g * g * (3 - 2 * g);
  const h = (a, b) => hash1(a * 127.1 + b * 311.7); return lerp(lerp(h(i, j), h(i + 1, j), u), lerp(h(i, j + 1), h(i + 1, j + 1), u), v); }
const cross3 = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];

/* ---------------- geometry builder ----------------
   vertex: pos3 nrm3 col3 uv2 bid1 mat1 = 13 floats
   mats: 0 office glass · 1 residential · 2 podium/retail · 3 concrete/roof · 4 village
         5 metal · 6 lattice shell · 7 landmark glass (LED) · 8 matte paint · 9 bridge deck */
const VS = 13;
class Geo {
  constructor() { this.v = []; this.i = []; this.n = 0; }
  vert(x, y, z, nx, ny, nz, c, u, w, bid, mat) { this.v.push(x, y, z, nx, ny, nz, c[0], c[1], c[2], u, w, bid, mat); return this.n++; }
  tri(a, b, c) { this.i.push(a, b, c); }
  quad(a, b, c, d) { this.i.push(a, b, c, a, c, d); }
}
function ccw(r) { return ringArea(r) < 0 ? r.slice().reverse() : r; }
function triangulate(pts) {
  const n = pts.length; if (n < 3) return [];
  const idx = []; for (let i = 0; i < n; i++) idx.push(i);

    eye = orbitEye(); tgt = [S.cam.tx, S.cam.ty || 0, S.cam.tz];
  }
  if (eye[1] < -1820) eye[1] = -1820;   // stay above the sea of clouds
  { // keep the camera out of the island
    const rr = Math.hypot(eye[0], eye[2]), R0 = isleR(Math.atan2(eye[2], eye[0]));
    if (eye[1] > -5 && eye[1] < 8 && rr < R0) eye[1] = 8;
    else if (eye[1] <= -5) { const lim = R0 * isleScaleAt(eye[1]) * 1.06 + 40; if (rr < lim) { const k = lim / Math.max(rr, 1); eye[0] *= k; eye[2] *= k; } }
  }
  S.eyeNow = eye; S.tgtNow = tgt;

  const W = canvas.width, H = canvas.height;
  const dist = Math.hypot(eye[0] - tgt[0], eye[1] - tgt[1], eye[2] - tgt[2]);
  const near = clamp(Math.min(dist, Math.abs(eye[1]) + 60) * 0.02, 0.8, 60), far = 90000;
  const proj = M.persp(0.78, W / H, near, far);
  const view = M.lookAt(eye, tgt, [0, 1, 0]);
  const vp = M.mul(proj, view); frame.vp = vp;
  frame.camR = [view[0], view[4], view[8]]; frame.camU = [view[1], view[5], view[9]];

  if (!S.ready) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H); gl.clearColor(0.05, 0.06, 0.09, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    return;
  }
  updateAir(t, reduceMotion ? 0 : dt, L, eye);
  stepTraffic(S.traffic, reduceMotion ? 0 : dt, L.night > 0.5);

  // ---- shadow pass
  const focus = S.tour || S.follow ? [eye[0] + (tgt[0] - eye[0]) * 0.4, 0, eye[2] + (tgt[2] - eye[2]) * 0.4] : [tgt[0], 0, tgt[2]];
  const hs = clamp((S.tour || S.follow ? Math.max(500, Math.abs(eye[1]) * 2.2) : dist * 0.75), 350, 4300);
  const texelW = 2 * hs / SM.size; SM.texel = texelW;
  const fx = Math.round(focus[0] / texelW) * texelW, fz = Math.round(focus[2] / texelW) * texelW;
  const ld = L.lightDir;
  const lview = M.lookAt([fx + ld[0] * 5000, ld[1] * 5000, fz + ld[2] * 5000], [fx, 0, fz], Math.abs(ld[1]) > 0.99 ? [1, 0, 0] : [0, 1, 0]);
  SM.vp = M.mul(M.ortho(-hs, hs, -hs, hs, 100, 10000), lview);
  if (L.dayF > 0.15 && SM.on) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, SM.fb); gl.viewport(0, 0, SM.size, SM.size);
    gl.clear(gl.DEPTH_BUFFER_BIT); gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.disable(gl.BLEND);
    gl.enable(gl.POLYGON_OFFSET_FILL); gl.polygonOffset(1.5, 2.0);
    gl.useProgram(P.shadow.p); gl.uniformMatrix4fv(P.shadow.u.uLightVP, false, SM.vp); gl.uniform1f(P.shadow.u.uRise, S.rise); gl.uniform1f(P.shadow.u.uMaxR, S.R * 1.42);
    gl.bindVertexArray(S.city.vao); gl.drawElements(gl.TRIANGLES, S.showGen ? S.city.count : S.lmIdx, gl.UNSIGNED_INT, 0);
    if (S.bridge) { gl.bindVertexArray(S.bridge.vao); gl.drawElements(gl.TRIANGLES, S.bridge.count, gl.UNSIGNED_INT, 0); }
    gl.bindVertexArray(S.island.vao); gl.drawElements(gl.TRIANGLES, S.island.count, gl.UNSIGNED_INT, 0);
    gl.bindVertexArray(S.feat.vao); gl.drawElements(gl.TRIANGLES, S.feat.count, gl.UNSIGNED_INT, 0);
    if (DYN.ni) {
      gl.uniform1f(P.shadow.u.uRise, 1);
      gl.bindVertexArray(DYN.vao.vao); gl.bindBuffer(gl.ARRAY_BUFFER, DYN.vao.vb); gl.bufferSubData(gl.ARRAY_BUFFER, 0, DYN.v, 0, DYN.nv * VS);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, DYN.vao.ib); gl.bufferSubData(gl.ELEMENT_ARRAY_BUFFER, 0, DYN.i, 0, DYN.ni);
      gl.drawElements(gl.TRIANGLES, DYN.ni, gl.UNSIGNED_INT, 0); DYN.uploaded = true;
    }
    gl.useProgram(P.treeShadow.p); gl.uniformMatrix4fv(P.treeShadow.u.uLightVP, false, SM.vp); gl.uniform1f(P.treeShadow.u.uRise, S.rise); gl.uniform1f(P.treeShadow.u.uMaxR, S.R * 1.42);
    for (const T of S.trees) { gl.bindVertexArray(T.vao); gl.drawElementsInstanced(gl.TRIANGLES, T.count, gl.UNSIGNED_SHORT, 0, T.n); }
    if (S.rise > 0.9) {
      gl.useProgram(P.instShadow.p); gl.uniformMatrix4fv(P.instShadow.u.uLightVP, false, SM.vp);
      gl.bindVertexArray(S.lampVAO.vao); gl.drawElementsInstanced(gl.TRIANGLES, S.lampVAO.count, gl.UNSIGNED_SHORT, 0, S.lampVAO.n);
      gl.bindVertexArray(S.carInst.vao); gl.drawElementsInstanced(gl.TRIANGLES, S.carInst.count, gl.UNSIGNED_SHORT, 0, S.carInst.n);
      gl.bindVertexArray(S.parked.vao); gl.drawElementsInstanced(gl.TRIANGLES, S.parked.count, gl.UNSIGNED_SHORT, 0, S.parked.n);
    }
    gl.disable(gl.POLYGON_OFFSET_FILL);
  }
  if (!DYN.uploaded && DYN.ni) {
    gl.bindVertexArray(DYN.vao.vao); gl.bindBuffer(gl.ARRAY_BUFFER, DYN.vao.vb); gl.bufferSubData(gl.ARRAY_BUFFER, 0, DYN.v, 0, DYN.nv * VS);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, DYN.vao.ib); gl.bufferSubData(gl.ELEMENT_ARRAY_BUFFER, 0, DYN.i, 0, DYN.ni);
  }
  DYN.uploaded = false;

  // ---- main pass (HDR, MSAA)
  gl.bindFramebuffer(gl.FRAMEBUFFER, RT.msFB); gl.viewport(0, 0, W, H);
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.disable(gl.CULL_FACE);
  gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND);
  gl.useProgram(P.sky.p); setCommon(P.sky, L, eye, now);
  gl.uniformMatrix4fv(P.sky.u.uInvVP, false, M.inv(vp)); gl.uniform3fv(P.sky.u.uMoonDir, L.moon);
  drawFS();
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.depthMask(true);
  gl.useProgram(P.sea.p); setCommon(P.sea, L, eye, now); gl.uniformMatrix4fv(P.sea.u.uVP, false, vp); gl.uniform1f(P.sea.u.uY, -1900);
  gl.bindVertexArray(S.seaVAO); gl.drawArrays(gl.TRIANGLES, 0, 6);
  // ground
  gl.useProgram(P.ground.p); setCommon(P.ground, L, eye, now);
  gl.uniformMatrix4fv(P.ground.u.uVP, false, vp); gl.uniform1f(P.ground.u.uR, S.R);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, S.tex); gl.uniform1i(P.ground.u.uTex, 0);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, S.luTex); gl.uniform1i(P.ground.u.uLU, 2); gl.activeTexture(gl.TEXTURE0);
  gl.enable(gl.POLYGON_OFFSET_FILL); gl.polygonOffset(4, 8);
  gl.bindVertexArray(S.ground.vao); gl.drawArrays(gl.TRIANGLES, 0, S.ground.count);
  // road surfaces: sidewalks were written first in the buffer, carriageways after → painter's order on the same plane
  gl.useProgram(P.road.p); setCommon(P.road, L, eye, now); gl.uniformMatrix4fv(P.road.u.uVP, false, vp);
  gl.bindVertexArray(S.roadVAO);
  gl.polygonOffset(3, 6); gl.drawArrays(gl.TRIANGLES, 0, S.walkCount);
  gl.polygonOffset(1, 2); gl.drawArrays(gl.TRIANGLES, S.walkCount, S.roadCount - S.walkCount);
  gl.disable(gl.POLYGON_OFFSET_FILL);
  // buildings, bridges, aircraft
  gl.useProgram(P.mesh.p); setCommon(P.mesh, L, eye, now);
  gl.uniformMatrix4fv(P.mesh.u.uVP, false, vp); gl.uniform1f(P.mesh.u.uSel, S.sel); gl.uniform1f(P.mesh.u.uLit, L.lit);
  gl.uniform3fv(P.mesh.u.uAccent, L.night > 0.5 ? [1.6, 1.0, 0.35] : [0.85, 0.45, 0.12]);
  gl.bindVertexArray(S.city.vao); gl.drawElements(gl.TRIANGLES, S.showGen ? S.city.count : S.lmIdx, gl.UNSIGNED_INT, 0);
  if (S.bridge) { gl.bindVertexArray(S.bridge.vao); gl.drawElements(gl.TRIANGLES, S.bridge.count, gl.UNSIGNED_INT, 0); }
  gl.uniform1f(P.mesh.u.uSel, -1); gl.bindVertexArray(S.island.vao); gl.drawElements(gl.TRIANGLES, S.island.count, gl.UNSIGNED_INT, 0);
  gl.enable(gl.POLYGON_OFFSET_FILL); gl.polygonOffset(0, 0);
  gl.bindVertexArray(S.feat.vao); gl.drawElements(gl.TRIANGLES, S.feat.count, gl.UNSIGNED_INT, 0);
  gl.disable(gl.POLYGON_OFFSET_FILL);
  gl.uniform1f(P.mesh.u.uSel, S.sel);
  if (DYN.ni) { gl.uniform1f(P.mesh.u.uRise, 1); gl.uniform1f(P.mesh.u.uSel, -1); gl.bindVertexArray(DYN.vao.vao); gl.drawElements(gl.TRIANGLES, DYN.ni, gl.UNSIGNED_INT, 0); }
  // trees
  gl.useProgram(P.tree.p); setCommon(P.tree, L, eye, now); gl.uniformMatrix4fv(P.tree.u.uVP, false, vp);
  for (const T of S.trees) { gl.bindVertexArray(T.vao); gl.drawElementsInstanced(gl.TRIANGLES, T.count, gl.UNSIGNED_SHORT, 0, T.n); }

  // cars, buses, street lights
  gl.useProgram(P.inst.p); setCommon(P.inst, L, eye, now);
  gl.uniformMatrix4fv(P.inst.u.uVP, false, vp); gl.uniform1f(P.inst.u.uFar, 2600); gl.uniform1f(P.inst.u.uRise, S.rise);
  gl.bindBuffer(gl.ARRAY_BUFFER, S.carInst.ib); gl.bufferSubData(gl.ARRAY_BUFFER, 0, S.traffic.inst);
  gl.bindVertexArray(S.carInst.vao); gl.drawElementsInstanced(gl.TRIANGLES, S.carInst.count, gl.UNSIGNED_SHORT, 0, S.carInst.n);
  gl.uniform1f(P.inst.u.uFar, 1600);
  gl.bindVertexArray(S.parked.vao); gl.drawElementsInstanced(gl.TRIANGLES, S.parked.count, gl.UNSIGNED_SHORT, 0, S.parked.n);
  stepWalkers(S.walk, reduceMotion ? 0 : dt, t);
  gl.uniform1f(P.inst.u.uFar, 750);
  gl.bindBuffer(gl.ARRAY_BUFFER, S.pedInst.ib); gl.bufferSubData(gl.ARRAY_BUFFER, 0, S.walk.pInst);
  gl.bindVertexArray(S.pedInst.vao); gl.drawElementsInstanced(gl.TRIANGLES, S.pedInst.count, gl.UNSIGNED_SHORT, 0, S.pedInst.n);
  gl.bindBuffer(gl.ARRAY_BUFFER, S.bikeInst.ib); gl.bufferSubData(gl.ARRAY_BUFFER, 0, S.walk.bInst);
  gl.bindVertexArray(S.bikeInst.vao); gl.drawElementsInstanced(gl.TRIANGLES, S.bikeInst.count, gl.UNSIGNED_SHORT, 0, S.bikeInst.n);
  gl.uniform1f(P.inst.u.uFar, 1500);
  gl.bindVertexArray(S.sigVAO.vao); gl.drawElementsInstanced(gl.TRIANGLES, S.sigVAO.count, gl.UNSIGNED_SHORT, 0, S.sigVAO.n);
  gl.bindVertexArray(S.busVAO.vao); gl.drawElementsInstanced(gl.TRIANGLES, S.busVAO.count, gl.UNSIGNED_SHORT, 0, S.busVAO.n);
  gl.uniform1f(P.inst.u.uFar, 1800);
  gl.bindVertexArray(S.lampVAO.vao); gl.drawElementsInstanced(gl.TRIANGLES, S.lampVAO.count, gl.UNSIGNED_SHORT, 0, S.lampVAO.n);
  // waterfalls
  gl.enable(gl.BLEND); gl.depthMask(false); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(P.fall.p); setCommon(P.fall, L, eye, now); gl.uniformMatrix4fv(P.fall.u.uVP, false, vp);
  gl.bindVertexArray(S.fallVAO); gl.drawArrays(gl.TRIANGLES, 0, S.fallCount);
  // points (cars, lights, drones)
  gl.useProgram(P.point.p);
  gl.uniformMatrix4fv(P.point.u.uVP, false, vp); gl.uniform3fv(P.point.u.uCam, eye); gl.uniform1f(P.point.u.uPx, H / (2 * Math.tan(0.39))); gl.uniform1f(P.point.u.uRise, S.rise);
  gl.enable(gl.BLEND); gl.depthMask(false);
  if (S.traffic.cars.length && L.night > 0.5) {
    gl.bindBuffer(gl.ARRAY_BUFFER, S.carBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, S.traffic.buf);
    if (L.night > 0.5) { gl.blendFunc(gl.ONE, gl.ONE); gl.uniform1f(P.point.u.uAdd, 1); } else { gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA); gl.uniform1f(P.point.u.uAdd, 0); }
    gl.bindVertexArray(S.carVAO); gl.drawArrays(gl.POINTS, 0, S.traffic.cars.length * 2);
  }
  if (AIR.nl) {
    gl.bindBuffer(gl.ARRAY_BUFFER, S.lightBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, AIR.lights, 0, AIR.nl * 7);
    gl.blendFunc(gl.ONE, gl.ONE); gl.uniform1f(P.point.u.uAdd, 1);
    gl.bindVertexArray(S.lightVAO); gl.drawArrays(gl.POINTS, 0, AIR.nl);
  }
  // beams
  if (AIR.nb) {
    gl.useProgram(P.beam.p); gl.uniformMatrix4fv(P.beam.u.uVP, false, vp); gl.uniform1f(P.beam.u.uNight, L.night);
    gl.bindBuffer(gl.ARRAY_BUFFER, S.beamBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, AIR.beams, 0, AIR.nb * 30);
    gl.blendFunc(gl.ONE, gl.ONE); gl.bindVertexArray(S.beamVAO); gl.drawArrays(gl.TRIANGLES, 0, AIR.nb * 6);
  }
  // clouds (sorted far → near)
  if (S.showClouds && S.clouds) {
    const C = S.clouds, buf = C.buf, wx = S.wind[0], wz = S.wind[1];
    const list = C.puffs.map(p => {
      let x = p.fixed ? p.x : ((p.x + wx + 7500) % 15000 + 15000) % 15000 - 7500, z = p.fixed ? p.z : ((p.z + wz + 7500) % 15000 + 15000) % 15000 - 7500;
      return [x, p.y, z, p.s, p.lit, p.a, (x - eye[0]) ** 2 + (p.y - eye[1]) ** 2 + (z - eye[2]) ** 2];
    }).sort((a, b) => b[6] - a[6]);
    list.forEach((q, i) => { const o = i * 6; buf[o] = q[0]; buf[o + 1] = q[1]; buf[o + 2] = q[2]; buf[o + 3] = q[3]; buf[o + 4] = q[4]; buf[o + 5] = q[5] * (1 - L.night * 0.35); });
    gl.useProgram(P.cloud.p); setCommon(P.cloud, L, eye, now);
    gl.uniformMatrix4fv(P.cloud.u.uVP, false, vp); gl.uniform3fv(P.cloud.u.uCamR, frame.camR); gl.uniform3fv(P.cloud.u.uCamU, frame.camU);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, C.tex); gl.uniform1i(P.cloud.u.uPuff, 1);
    gl.uniform1f(P.cloud.u.uPuffA, C.texA); gl.uniform1f(P.cloud.u.uAspect, C.texA ? 1.5 : 1);
    gl.bindBuffer(gl.ARRAY_BUFFER, C.ib); gl.bufferSubData(gl.ARRAY_BUFFER, 0, buf);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.bindVertexArray(C.vao); gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, C.puffs.length);
  }
  gl.depthMask(true); gl.disable(gl.BLEND);
  gl.bindVertexArray(null);

  // ---- resolve + bloom + composite
  if (RT.msFB !== RT.resFB) {
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, RT.msFB); gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, RT.resFB);
    gl.blitFramebuffer(0, 0, W, H, 0, 0, W, H, gl.COLOR_BUFFER_BIT, gl.NEAREST);
  }
  gl.disable(gl.DEPTH_TEST);
  const B = RT.bloom;
  if (B.length) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, B[0].fb); gl.viewport(0, 0, B[0].w, B[0].h);
    gl.useProgram(P.bright.p); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, RT.sceneTex); gl.uniform1i(P.bright.u.uTex, 0);
    gl.uniform1f(P.bright.u.uThr, RT.hdr ? lerp(1.15, 0.85, L.night) : 0.8); drawFS();
    gl.useProgram(P.down.p); gl.uniform1i(P.down.u.uTex, 0);
    for (let i = 1; i < B.length; i++) { gl.bindFramebuffer(gl.FRAMEBUFFER, B[i].fb); gl.viewport(0, 0, B[i].w, B[i].h); gl.bindTexture(gl.TEXTURE_2D, B[i - 1].t); gl.uniform2f(P.down.u.uTexel, 1 / B[i - 1].w, 1 / B[i - 1].h); drawFS(); }
    gl.useProgram(P.up.p); gl.uniform1i(P.up.u.uTex, 0); gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
    for (let i = B.length - 1; i > 0; i--) { gl.bindFramebuffer(gl.FRAMEBUFFER, B[i - 1].fb); gl.viewport(0, 0, B[i - 1].w, B[i - 1].h); gl.bindTexture(gl.TEXTURE_2D, B[i].t); gl.uniform2f(P.up.u.uTexel, 1 / B[i].w, 1 / B[i].h); drawFS(); }
    gl.disable(gl.BLEND);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
  gl.useProgram(P.comp.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, RT.sceneTex); gl.uniform1i(P.comp.u.uScene, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, B.length ? B[0].t : RT.sceneTex); gl.uniform1i(P.comp.u.uBloom, 1);
  gl.uniform1f(P.comp.u.uBloomK, B.length ? lerp(0.35, 0.9, L.night) : 0); gl.uniform1f(P.comp.u.uExpo, lerp(0.92, 1.15, L.night)); gl.uniform1f(P.comp.u.uNight, L.night);
  drawFS();
  gl.activeTexture(gl.TEXTURE0);

  // ---- labels
  AIR.planes.forEach((p, i) => { const l = S.airLabels[i]; if (p.pos && l) { l.x = p.pos[0]; l.y = p.pos[1] + 6; l.z = p.pos[2]; } });
  const cw = VIEW.cw, ch = VIEW.ch, placed = [];
  const order = S.labels.slice().sort((a, b) => b.prio - a.prio);
  for (const l of order) {
    const y = l.dyn ? l.y : l.y * S.rise;
    const p = M.xf(vp, l.x, y, l.z);
    let vis = p[3] > 0 && p[0] > -1.05 && p[0] < 1.05 && p[1] > -1.05 && p[1] < 1.05 && p[2] < 1 && S.rise > 0.9;
    const sx = (p[0] * 0.5 + 0.5) * cw, sy = (1 - (p[1] * 0.5 + 0.5)) * ch;
    const d = Math.hypot(eye[0] - l.x, eye[1] - y, eye[2] - l.z);
    const isB = l.el.classList.contains("bld"), isAir = l.dyn;
    if (vis && isB && d > S.R * 4.2) vis = false;
    if (vis && !isAir && eye[1] < -20) vis = false;
    if (vis && isAir && d > 5200) vis = false;
    if (vis) {
      const isC = !isB && !isAir;
      const bx = { x0: sx - l.w / 2, x1: sx + l.w / 2, y0: isC ? sy - l.h / 2 : sy - l.h, y1: isC ? sy + l.h / 2 : sy };
      if (placed.some(q => bx.x0 < q.x1 && bx.x1 > q.x0 && bx.y0 < q.y1 && bx.y1 > q.y0)) vis = false; else placed.push(bx);
    }
    l.el.style.opacity = vis ? "" : "0";
    if (vis) l.el.style.transform = `translate(${sx.toFixed(1)}px, ${sy.toFixed(1)}px) translate(-50%, ${isB ? "-100%" : isAir ? "-150%" : "-50%"})`;
  }
  // status line
  if (!S._skyT || now - S._skyT > 500) {
    S._skyT = now;
    const items = [`热气球 ${(AIR.balloons || []).length}`, `飞艇 1`, `瀑布 ${FALLS.groups.length} 道`, `船 ${(AIR.boats || []).length} 艘`, `塔吊 ${(AIR.cranes || []).length} 台`, `✈ 航班 ${AIR.planes.length}`, `🚁 直升机 ${AIR.helis.length}`, `白鹭 ${AIR.flocks.reduce((a, f) => a + f.n, 0)} 只`, `配送无人机 ${AIR.quads.length}`];
    if (AIR.show.active) items.push(`<b>灯光秀进行中 · ${AIR.show.N} 架 · 孔明灯升空</b>`); else items.push("灯光秀与孔明灯 19:00 后开始");
    $("#sky").innerHTML = "空中：" + items.join(" · ");
  }
}
requestAnimationFrame(tick);

/* ---------------- boot ---------------- */
(() => {
  const szHour = (new Date().getUTCHours() + 8 + new Date().getUTCMinutes() / 60) % 24;
  const t0 = szHour < 5 ? szHour + 24 : szHour;
  setTod(Math.round(t0 * 20) / 20, false);
})();
(async () => {
  try { const mask = await loadMask(); const lu = await loadImg(D.lu); await buildScene(mask, lu); }
  catch (e) { console.error(e); loader.show("加载失败", "场景构建出错，请刷新页面重试。", { err: e.message || String(e) }); }
})();
</script>
